<!-- FIRST TIME: You must open your Gmail pen1921@gmail.com and click Activate from FormSubmit after first test, otherwise mails are blocked -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
 <link rel="stylesheet" href="styles.css" />
<title>Contact — Kaiser A ÖzHun</title>

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Georgia,serif;background:#faf9f6;color:#1a1a1a;line-height:1.6;padding:40px 20px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-family:Georgia,serif;font-weight:400;font-size:32px;letter-spacing:-0.02em;margin-bottom:8px}
  .sub{font-family:Helvetica,Arial,sans-serif;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#888;margin-bottom:32px}
  .note{font-family:Helvetica,Arial,sans-serif;font-size:11px;line-height:1.5;color:#8a8580;border:1px solid #e8e5e0;background:#fff;padding:12px 14px;margin-bottom:28px}
  form{border:1px solid #1a1a1a;padding:28px;background:#fff}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:520px){.row{grid-template-columns:1fr}}
  label{font-family:Helvetica,Arial,sans-serif;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#555;display:block;margin-bottom:6px}
  input,select,textarea{width:100%;border:1px solid #d9d5d0;padding:12px 14px;font-family:Georgia,serif;font-size:15px;background:#fffcf9;outline:none;transition:border-color .2s}
  input:focus,select:focus,textarea:focus{border-color:#1a1a1a;background:#fff}
  textarea{min-height:140px;resize:vertical}
  .field{margin-bottom:18px}
  .honey{position:absolute;left:-5000px;top:auto;width:1px;height:1px;overflow:hidden}
  button{width:100%;background:#1a1a1a;color:#faf9f6;border:1px solid #1a1a1a;padding:14px;font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;cursor:pointer;transition:all .2s}
  button:hover{background:transparent;color:#1a1a1a}
  button:disabled{opacity:.4;cursor:not-allowed}
  .msg{margin-top:18px;padding:14px;border:1px solid;font-family:Helvetica,Arial,sans-serif;font-size:13px;display:none}
  .msg.ok{display:block;border-color:#1a1a1a;background:#f6f5f2;color:#1a1a1a}
  .msg.err{display:block;border-color:#c7a0a0;background:#fdf6f6;color:#6b2a2a}
  .fallback{margin-top:22px;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#888;text-align:center}
  .fallback a{color:#1a1a1a;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
      <a href="./index.html">Home</a>
      <a href="./exhibition.html">Exhibition</a>
      <a href="./contact.html">Contact</a>
    </nav>

<div class="wrap">
  <h1>Kaiser A ÖzHun</h1>
  <div class="sub">Inquiry — Gallery Contact</div>
 <div class="note" style="background:#ffffff; border-left:2px solid #d6d3ce; padding:16px 20px; margin:32px 0 24px 0; font-family:Inter, sans-serif; font-size:14px; line-height:1.6; color:#6b6b6b;">
  <p style="margin:0;">
    <strong style="display:block; font-family:'Cormorant Garamond', serif; font-size:17px; font-weight:500; color:#2a2a2a; margin-bottom:4px; line-height:1.4; letter-spacing:0.02em;">Have a question or an idea for collaboration?</strong>
    Fill in the form below, and I'll get back to you as soon as possible.
  </p>
</div>

  <form id="kaiser-form" autocomplete="on">
    <!-- Honeypot for bots -->
    <div class="honey" aria-hidden="true">
      <label>Leave this empty</label>
      <input type="text" name="_honey" tabindex="-1" autocomplete="off">
    </div>

    <!-- FormSubmit config -->
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_subject" id="hidden-subject" value="New Gallery Inquiry">

    <div class="row">
      <div class="field">
        <label for="name">Name *</label>
        <input id="name" name="name" type="text" required placeholder="Full name">
      </div>
      <div class="field">
        <label for="email">Email *</label>
        <input id="email" name="email" type="email" required placeholder="your@email.com">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="subject">Subject</label>
        <select id="subject" name="subject">
          <option value="General Inquiry">General Inquiry</option>
          <option value="Artwork Availability">Artwork Availability</option>
          <option value="Commission Request">Commission Request</option>
          <option value="Exhibition">Exhibition</option>
          <option value="Press">Press</option>
        </select>
      </div>
      <div class="field">
        <label for="artwork">Artwork / Reference</label>
        <input id="artwork" name="artwork" type="text" placeholder="Title or ID (optional)">
      </div>
    </div>

    <div class="field">
      <label for="message">Message *</label>
      <textarea id="message" name="message" required placeholder="Tell me about your inquiry..."></textarea>
    </div>

    <button type="submit" id="submit-btn">Send Inquiry</button>
    <div id="form-msg" class="msg"></div>

    <div class="fallback">
      Trouble sending? <a href="mailto:pen1921@gmail.com?subject=Gallery%20Inquiry">Email directly to pen1921@gmail.com</a>
    </div>
  </form>
</div>

<script>
  const form = document.getElementById('kaiser-form');
  const btn = document.getElementById('submit-btn');
  const msgBox = document.getElementById('form-msg');
  const hiddenSubject = document.getElementById('hidden-subject');

  function showMsg(type, text){
    msgBox.className = 'msg ' + (type === 'ok' ? 'ok' : 'err');
    msgBox.textContent = text;
    msgBox.style.display = 'block';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    // Honeypot check
    if(form._honey && form._honey.value){
      showMsg('ok', 'Thank you, inquiry sent — I will reply to your email');
      form.reset();
      return;
    }

    const name = form.name.value.trim();
    const email = form.email.value.trim();
    const subjectSel = form.subject.value;
    const artwork = form.artwork.value.trim();
    const message = form.message.value.trim();

    // Build dynamic _subject for inbox clarity
    hiddenSubject.value = '[' + subjectSel + '] ' + (artwork ? artwork + ' — ' : '') + name;

    btn.disabled = true;
    btn.textContent = 'Sending...';
    msgBox.style.display = 'none';

    try {
      const payload = {
        name: name,
        email: email,
        subject: subjectSel,
        artwork: artwork,
        message: message,
        _subject: hiddenSubject.value,
        _captcha: "false",
        _template: "table",
        _honey: ""
      };

      const res = await fetch('https://formsubmit.co/ajax/pen1921@gmail.com', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if(res.ok){
        showMsg('ok', 'Thank you, inquiry sent — I will reply to your email');
        form.reset();
      } else {
        throw new Error(data.message || 'Failed');
      }
    } catch (err){
      showMsg('err', 'Failed, please email directly to pen1921@gmail.com');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send Inquiry';
    }
  });
</script>
</body>
</html>
